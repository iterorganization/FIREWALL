name: Documentation

# Publishes the Doxygen API documentation to GitHub Pages.
#
# NOTE FOR MAINTAINERS: this workflow uses the official GitHub Pages deployment
# actions rather than pushing to a gh-pages branch. Before the first run, set
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# The old gh-pages branch can then be deleted.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # docs/Doxyfile is written for Doxygen 1.16.1. Ubuntu 24.04 packages 1.9.8,
  # which silently ignores 16 of its settings, so the published site would not
  # match what a current Doxygen produces locally. Pin a release that
  # understands the whole file, and verify what we download.
  DOXYGEN_VERSION: "1.18.0"
  DOXYGEN_SHA256: "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # doxygen-awesome-css is a submodule and the Doxyfile references its
      # stylesheet, so it must be checked out or the theme is silently dropped.
      # Actions are pinned by commit SHA; the trailing comment records the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y graphviz

      - name: Install Doxygen ${{ env.DOXYGEN_VERSION }}
        run: |
          tag="Release_${DOXYGEN_VERSION//./_}"
          url="https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" "$url"
          echo "${DOXYGEN_SHA256}  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Paths in docs/Doxyfile are relative to the repository root.
      - name: Build documentation
        run: |
          doxygen --version
          doxygen docs/Doxyfile

      - name: Check that API pages were actually produced
        run: |
          count=$(find docs/html -name 'class*.html' | wc -l)
          echo "Generated $count class pages."
          if [ "$count" -eq 0 ]; then
            echo "::error::Doxygen produced no API pages - check INPUT in docs/Doxyfile."
            exit 1
          fi

      # Pull requests stop here: the documentation is built and checked, but
      # the Pages artifact is only worth producing for a run that deploys.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: docs/html

  deploy:
    # Only publish from the default branch; pull requests just build.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
